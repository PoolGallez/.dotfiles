# ─────────────────────────────────────────────────────────────────────────────
# secrets/rock-pro64.yaml
#
# This file is managed by sops.  Edit with:
#   sops secrets/rock-pro64.yaml
#
# Before editing, make sure .sops.yaml is configured with your age key AND
# the host's age key (derived from its SSH ed25519 key).
#
# Get the host age key after first boot:
#   ssh-keyscan rock-pro64 | ssh-to-age
# ─────────────────────────────────────────────────────────────────────────────

# The values below are PLACEHOLDERS — sops will encrypt them.
# Replace with real secrets before deploying.

nextcloud:
    adminPassword: ENC[AES256_GCM,data:PLACEHOLDER,tag:PLACEHOLDER,type:str]
    dbPassword: ENC[AES256_GCM,data:PLACEHOLDER,tag:PLACEHOLDER,type:str]

pihole:
    webPassword: ENC[AES256_GCM,data:PLACEHOLDER,tag:PLACEHOLDER,type:str]

immich:
    dbPassword: ENC[AES256_GCM,data:PLACEHOLDER,tag:PLACEHOLDER,type:str]

acme:
    # Must be in lego env format: DUCKDNS_TOKEN=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    duckdnsToken: ENC[AES256_GCM,data:PLACEHOLDER,tag:PLACEHOLDER,type:str]

wireguard:
    serverPrivateKey: ENC[AES256_GCM,data:PLACEHOLDER,tag:PLACEHOLDER,type:str]
    peers:
        phone:
            presharedKey: ENC[AES256_GCM,data:PLACEHOLDER,tag:PLACEHOLDER,type:str]
        laptop:
            presharedKey: ENC[AES256_GCM,data:PLACEHOLDER,tag:PLACEHOLDER,type:str]
        # tablet:
        #     presharedKey: ENC[AES256_GCM,data:PLACEHOLDER,tag:PLACEHOLDER,type:str]

sops:
    kms: []
    gcp_kms: []
    azure_kv: []
    lastmodified: "2025-01-01T00:00:00Z"
    mac: ENC[AES256_GCM,data:PLACEHOLDER,tag:PLACEHOLDER,type:str]
    pgp: []
    age:
        # Your personal age key (workstation)
        - recipient: age1YOURPERSONALAGEKEY
          enc: |
            -----BEGIN AGE ENCRYPTED FILE-----
            PLACEHOLDER
            -----END AGE ENCRYPTED FILE-----
        # Host age key (rock-pro64, derived from SSH ed25519)
        - recipient: age1ROCKHOSTAGEKEY
          enc: |
            -----BEGIN AGE ENCRYPTED FILE-----
            PLACEHOLDER
            -----END AGE ENCRYPTED FILE-----
    version: 3.9.1
